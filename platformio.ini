; FlapBoard — split-flap sign + photo frame for the M5Stack Tab5.
; Toolchain as in T48-for-Tab5: the P4 needs the pioarduino platform fork,
; and the m5stack-tab5-p4 board brings M5Unified itself. The platform is
; pinned to a release (not "stable") so builds stay reproducible.
; 55.03.312-1 (2026-10-06) = Arduino core 3.3.12 / ESP-IDF 5.5.5, the same as
; T48-for-Tab5 (PlatformIO keeps one copy of the core libraries, so the two
; projects share it); its esp-hosted uses less internal RAM. Needs PlatformIO
; Core >= 6.2.

[platformio]
default_envs = app

[common_tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
lib_deps = https://github.com/M5Stack/M5GFX.git
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Phase 0: report chip/firmware/peripheral versions; update the C6 if asked.
[env:probe]
extends = common_tab5
board_build.partitions = partitions_probe.csv
build_src_filter = +<probe/>

; Camera spike (PLAN 11a): esp_video on the Tab5's sensor, fps/RAM cost.
[env:camspike]
extends = common_tab5
board_build.partitions = partitions.csv
build_src_filter = +<camspike/>

; The sign itself.
[env:app]
extends = common_tab5
board_build.partitions = partitions.csv
lib_deps =
    ${common_tab5.lib_deps}
    bblanchon/ArduinoJson@^7.2.0
extra_scripts = pre:tools/embed_web.py
build_flags = -DFLAPBOARD_VERSION=\"0.10.1\"
build_src_filter = +<app/>

; Host-side unit tests for the plain C++ modules: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = yes
build_src_filter = -<*> +<app/library.cpp> +<app/multipart.cpp> +<app/content_parse.cpp> +<app/schedule.cpp> +<app/photos.cpp>
