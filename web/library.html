<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Files - FlapBoard</title><link rel="stylesheet" href="/style.css">
<style>
.crumbs{font-size:14px;color:var(--dim);margin:0 0 12px;word-break:break-all}.crumbs a{cursor:pointer;color:var(--accent)}
.space{margin-left:auto;font-size:13px;color:var(--dim)}.space.low{color:var(--bad);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--panel)}
.item .thumb{height:96px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
.item .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item .nm{padding:6px 8px;font-size:13px;word-break:break-all;flex:1}
.item .acts{display:flex;border-top:1px solid var(--border)}
.item .acts button{flex:1;background:none;border:none;color:var(--accent);border-radius:0;font-size:12px;font-weight:500;padding:6px}
.item .acts button.del{color:var(--bad)}
.empty{padding:36px 12px;text-align:center;color:var(--dim)}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:0 0 12px;display:none}.prog i{display:block;height:100%;background:var(--accent);width:0}
#progtxt{font-size:13px;color:var(--dim);margin:-6px 0 12px;display:none}
</style></head><body>
<header><div class="in"><b id="name">FlapBoard</b>
<nav><a href="/">Status</a><a href="/display">Display</a><a href="/messages">Messages</a><a href="/photos">Photos</a><a href="/schedule">Schedule</a><a href="/clock">Clock &amp; weather</a><a href="/library" class="on">Files</a></nav></div></header>
<main><section class="card">
<div class="crumbs" id="crumbs"></div>
<div id="note"></div>
<div class="prog" id="prog"><i id="progbar"></i></div><div id="progtxt"></div>
<div class="row" style="margin:0 0 14px"><button id="up">Upload files</button><button class="sec" id="mkdir">New folder</button><span class="space" id="space"></span></div>
<label id="shrinkrow" style="display:flex;gap:8px;align-items:center;margin:-6px 0 12px;color:var(--text);font-size:14px" hidden><input type="checkbox" id="shrink" checked style="width:auto"> Shrink photos to the screen's size while uploading (recommended: faster, and iPhone HEIC photos work)</label>
<input type="file" id="picker" multiple style="display:none">
<div id="list"></div>
</section></main>
<script>
// Ported from the Pi photo frame's file manager: same /library API and JSON.
let cwd='';
const $=s=>document.querySelector(s);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const q=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function size(n){if(n==null)return'';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i?n.toFixed(1):n)+' '+u[i]}
function note(kind,text){$('#note').innerHTML='<div class="msg '+kind+'">'+esc(text)+'</div>';if(kind==='ok')setTimeout(()=>$('#note').innerHTML='',4000)}
function crumbs(path){let out='<a onclick="go(\'\')">SD card</a>',acc='';
  (path?path.split('/'):[]).forEach(p=>{acc=acc?acc+'/'+p:p;out+=' / <a onclick="go(\''+q(acc)+'\')">'+esc(p)+'</a>'});return out}
async function go(path){cwd=path||'';
  try{const r=await fetch('/library/list?path='+encodeURIComponent(cwd));const d=await r.json();
    if(!r.ok){note('err',d.error||'Could not open folder');return}render(d)}catch(e){note('err','Could not reach the sign')}}
function icon(e){if(e.type==='dir')return'&#128193;';if(e.is_image)return'&#128247;';
  const x=e.name.toLowerCase().split('.').pop();return x==='txt'?'&#128221;':x==='wav'?'&#127925;':(x==='ttf'||x==='otf')?'&#128288;':'&#128196;'}
function inPhotos(){return cwd==='photos'||cwd.startsWith('photos/')}
function render(d){cwd=d.path||'';$('#crumbs').innerHTML=crumbs(cwd);$('#shrinkrow').hidden=!inPhotos();
  const sp=$('#space');sp.textContent=d.total_bytes?size(d.free_bytes)+' free':'';sp.className='space'+(d.low_space?' low':'');
  if(!d.entries.length){$('#list').innerHTML='<div class="empty">This folder is empty.<br>Use <b>Upload files</b> to add some.</div>';return}
  let h='<div class="grid">';
  d.entries.forEach(e=>{const p=q(e.path);h+='<div class="item">';
    if(e.type==='dir')h+='<div class="thumb" onclick="go(\''+p+'\')">'+icon(e)+'</div>';
    else if(e.is_image)h+='<div class="thumb" onclick="window.open(\'/library/download?path='+encodeURIComponent(e.path)+'\')"><img loading="lazy" src="/library/thumb?path='+encodeURIComponent(e.path)+'" onerror="this.replaceWith(document.createTextNode(\'\u{1F4F7}\'))"></div>';
    else h+='<div class="thumb" onclick="window.open(\'/library/download?path='+encodeURIComponent(e.path)+'\')">'+icon(e)+'</div>';
    h+='<div class="nm">'+esc(e.name)+(e.size!=null?'<br><span class="dim">'+size(e.size)+'</span>':'')+'</div>';
    h+='<div class="acts"><button onclick="rn(\''+p+'\',\''+q(e.name)+'\')">Rename</button><button class="del" onclick="rm(\''+p+'\',\''+(e.type==='dir'?'folder':'file')+'\')">Delete</button></div></div>'});
  $('#list').innerHTML=h+'</div>'}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return{ok:r.ok,d:await r.json()}}
async function rn(path,cur){const name=prompt('New name:',cur);if(!name||name===cur)return;
  const res=await post('/library/rename',{path,name});if(!res.ok){note('err',res.d.error||'Rename failed');return}note('ok','Renamed.');go(cwd)}
async function rm(path,kind){if(!confirm('Delete this '+kind+'?'+(kind==='folder'?'\n\nEverything inside it will be deleted too.':'')))return;
  const res=await post('/library/delete',{path});if(!res.ok){note('err',res.d.error||'Delete failed');return}note('ok','Deleted.');go(cwd)}
$('#mkdir').onclick=async()=>{const name=prompt('Folder name:');if(!name)return;
  const res=await post('/library/mkdir',{path:cwd,name});if(!res.ok){note('err',res.d.error||'Could not create folder');return}note('ok','Folder created.');go(cwd)};
$('#up').onclick=()=>$('#picker').click();

// Safari will not serialise a File taken straight from a file input into an
// XHR multipart body (it sends no data), so each file is read into an
// ArrayBuffer and re-wrapped as a Blob first (found on the Pi frame).
function readFile(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error('unreadable'));fr.readAsArrayBuffer(f)})}
// Photos: decode in the browser (Safari also reads HEIC), scale so the
// picture still covers 1280x720, and send a baseline JPEG plus a 240x135
// thumbnail. The Tab5's decoders only take baseline JPEG and PNG, and a
// 12 MP original would take a minute to send over its Wi-Fi.
async function shrinkPhoto(f){
  const url=URL.createObjectURL(f);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,Math.max(1280/img.naturalWidth,720/img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,cv.width,cv.height);
    const main=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88));
    const t=document.createElement('canvas');t.width=240;t.height=135;const tc=t.getContext('2d');
    const kt=Math.max(240/img.naturalWidth,135/img.naturalHeight);tc.imageSmoothingQuality='high';
    tc.drawImage(img,(240-img.naturalWidth*kt)/2,(135-img.naturalHeight*kt)/2,img.naturalWidth*kt,img.naturalHeight*kt);
    const thumb=await new Promise(r=>t.toBlob(r,'image/jpeg',0.8));
    return {main,thumb,name:f.name.replace(/\.[^.]+$/,'')+'.jpg'}}
  catch(e){return null}finally{URL.revokeObjectURL(url)}}
function sendOne(f,buf,onProgress,thumb){return new Promise(resolve=>{
  const fd=new FormData();fd.append('path',cwd);if(thumb)fd.append('thumb','1');fd.append('file',new Blob([buf],{type:f.type||'application/octet-stream'}),f.name);
  const x=new XMLHttpRequest();x.open('POST','/library/upload');x.timeout=120000;
  x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total)};
  x.onload=()=>{let d={};try{d=JSON.parse(x.responseText)}catch(_){}resolve({ok:x.status===200,data:d,status:x.status})};
  x.onerror=x.ontimeout=()=>resolve({ok:false,data:{error:'connection lost'},status:0});x.send(fd)})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// One request per file, one at a time: only one file is held in memory, the
// Tab5's Wi-Fi link is never asked to take two streams at once, and a file
// that fails over a dropped connection is retried (twice, with a pause)
// instead of failing the batch.
$('#picker').onchange=async function(){
  const files=[...this.files];if(!files.length)return;
  const prog=$('#prog'),bar=$('#progbar'),txt=$('#progtxt');prog.style.display=txt.style.display='block';bar.style.width='0';$('#up').disabled=true;
  let saved=0,skipped=[],failed=[];
  for(let i=0;i<files.length;i++){const f=files[i],base=i/files.length;
    txt.textContent='Uploading '+(i+1)+' of '+files.length+': '+f.name;
    let res=null;
    try{let up=f,buf,thumb=null;
      const isImg=/^image\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name);
      if(inPhotos()&&$('#shrink').checked&&isImg){txt.textContent='Shrinking '+f.name+'...';const sp=await shrinkPhoto(f);
        if(sp){up={name:sp.name,type:'image/jpeg'};buf=await sp.main.arrayBuffer();thumb=sp.thumb}}
      if(!buf)buf=await readFile(f);
      txt.textContent='Uploading '+(i+1)+' of '+files.length+': '+up.name;
      for(let attempt=0;attempt<3;attempt++){
        if(attempt){txt.textContent='Retrying '+up.name+' ('+(attempt+1)+' of 3)...';await sleep(3000*attempt)}
        res=await sendOne(up,buf,fr=>bar.style.width=((base+fr/files.length)*100)+'%');
        if(res.ok||res.status>=400)break;   // only a lost connection is worth retrying
      }
      if(res.ok&&thumb&&res.data.saved&&res.data.saved[0]){   // its thumbnail, under the name it was saved as
        const saved=res.data.saved[0].split('/').pop();await sendOne({name:saved,type:'image/jpeg'},await thumb.arrayBuffer(),()=>{},true)}
    }catch(e){res={ok:false,data:{error:'unreadable'},status:0}}
    if(res.ok){saved+=(res.data.saved||[]).length;skipped=skipped.concat(res.data.skipped||[])}
    else failed.push(f.name+' ('+(res.data.error||res.status)+')');
    bar.style.width=(((i+1)/files.length)*100)+'%'}
  prog.style.display=txt.style.display='none';$('#up').disabled=false;this.value='';
  const parts=[];if(saved)parts.push(saved+' file'+(saved===1?'':'s')+' uploaded.');
  if(skipped.length)parts.push('Skipped '+skipped.length+' (names starting with a dot are not allowed).');
  if(failed.length)parts.push('Failed: '+failed.join(', ')+'.');
  note(failed.length?'err':'ok',parts.join(' ')||'Nothing to upload.');go(cwd)};
fetch('/api/status').then(r=>r.json()).then(s=>{$('#name').textContent=s.device_name}).catch(()=>{});
go('');
</script></body></html>
